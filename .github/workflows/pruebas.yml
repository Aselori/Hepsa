name: Pruebas

on:
  # Sin filtro de rama a proposito: con "branches: [main]" un PR apilado sobre
  # otra rama no disparaba nada y se quedaba sin una sola comprobacion, en
  # silencio y sin que el PR lo dijera. Un control que no corre es peor que uno
  # que falla, porque parece que no hay nada que revisar.
  pull_request:
  push:
    branches: [main]

jobs:
  comprobaciones:
    name: Sintaxis y suites
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Estas dos comprobaciones no necesitan credenciales, asi que corren
      # siempre y sirven para exigirlas como control obligatorio del PR.
      - name: Sintaxis de los modulos de prueba
        run: |
          for f in tests/*.mjs auth-mfa.js config.js; do
            node --check "$f" || exit 1
          done

      - name: Sintaxis del JavaScript incrustado en el HTML
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys, tempfile
          fallos = 0
          for pagina in ('index.html', 'admin.html'):
              texto = pathlib.Path(pagina).read_text(encoding='utf-8')
              for i, bloque in enumerate(re.findall(r'<script>(.*?)</script>', texto, re.S)):
                  with tempfile.NamedTemporaryFile('w', suffix='.mjs', delete=False,
                                                   encoding='utf-8') as tmp:
                      tmp.write(bloque)
                      ruta = tmp.name
                  r = subprocess.run(['node', '--check', ruta],
                                     capture_output=True, text=True)
                  if r.returncode:
                      print(f'{pagina}, bloque {i}:\n{r.stderr}')
                      fallos += 1
          print('sin errores de sintaxis' if not fallos else f'{fallos} bloques con errores')
          sys.exit(1 if fallos else 0)
          PY

      - name: Instalar dependencias fijadas
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Regresiones aisladas de MFA y panel
        run: npm test

      - name: Iniciar Supabase local
        run: npx supabase start

      - name: Integracion real de RLS, MFA y panel
        run: npm run test:local

      - name: Detener Supabase local
        if: always()
        run: npx supabase stop
