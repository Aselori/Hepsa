<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pestaña del navegador. El rombo cambia de color con el tema del sistema,
       porque la pestaña no sabe qué tema eligió el visitante dentro del sitio. -->
  <style>.r{fill:#1D1F22}.b{fill:#C9A227}@media (prefers-color-scheme:dark){.r{fill:#ECEBE7}.b{fill:#D4AF37}}</style>
  <defs><mask id="c" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><rect y="53.5" width="100" height="15" fill="#000"/></mask></defs>
  <path class="r" d="M50 4 96 50 50 96 4 50Z" mask="url(#c)"/>
  <rect class="b" x="2" y="57" width="96" height="8"/>
</svg>
