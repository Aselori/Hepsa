# Entorno local de pruebas. project_id identifica contenedores locales;
# no vincula esta carpeta con el proyecto remoto del equipo.
project_id = "hepsa-mfa-local"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = ["http://localhost:8000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true

# Mejora 2. Ninguna de las dos usa la verificacion de JWT de la pasarela:
# Stripe no manda un token de Supabase, y crear-pago comprueba la sesion del
# cliente por su cuenta con auth.getUser().
[functions.crear-pago]
verify_jwt = false

[functions.webhook-stripe]
verify_jwt = false

[analytics]
enabled = false
